name: Reportar um bug
description: Algo não funcionou como esperado no 3DReport
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por reportar! Quanto mais detalhe, mais rápido dá pra
        reproduzir e corrigir.
  - type: textarea
    id: descricao
    attributes:
      label: O que aconteceu?
      description: Descreva o problema com clareza.
      placeholder: "Ex.: ao exportar o PDF do orçamento, a marca d'água não aparece."
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: O que você esperava que acontecesse?
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Passos para reproduzir
      placeholder: |
        1. Abra a aba Orçamento
        2. Preencha ...
        3. Clique em ...
    validations:
      required: true
  - type: input
    id: versao
    attributes:
      label: Versão do 3DReport
      description: Veja no rodapé do app ou em Ajuda.
      placeholder: "ex.: 1.8.0"
    validations:
      required: true
  - type: dropdown
    id: so
    attributes:
      label: Sistema operacional
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots ou informações extras (opcional)
