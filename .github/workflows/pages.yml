name: Deploy site (GitHub Pages)

# Publica o conteúdo de site/ no GitHub Pages a cada push em main que muda
# a pasta do site ou a fórmula (core/), já que a calculadora do site
# (site/calculadora.html) é o core compilado pra JavaScript (decisão 98).
# Pré-requisito: em Settings → Pages, "Source" precisa estar em "GitHub
# Actions" (ver docs/roadmap.md, seção 2).
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "core/**"
      - "web/**"
      - "gradle/**"
      - "*.gradle.kts"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Gerar a calculadora do site
        run: ./gradlew :web:syncSiteCalculator

      # O Pages manda CSS e JS com 10 min de cache: sem uma versão no link, quem abriu o site pouco
      # antes do deploy vê o HTML novo com o CSS velho. Os HTMLs apontam pra "?v=dev" e aqui isso
      # vira o commit publicado.
      - name: Versionar CSS e JS
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::8}/g" site/*.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
