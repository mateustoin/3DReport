name: Deploy site (GitHub Pages)

# Publica o conteúdo de site/ no GitHub Pages a cada push em main que muda
# a pasta do site. Pré-requisito: em Settings → Pages, "Source" precisa
# estar em "GitHub Actions" (ver docs/roadmap.md, seção 2).
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
