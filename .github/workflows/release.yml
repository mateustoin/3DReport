name: Release

# Dispara só com o push de uma tag de versão (ex.: v0.3.0) — nunca em push
# normal de branch. Ver docs/development.md#como-cortar-um-release.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-installer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-deb
            glob: composeApp/build/compose/binaries/main/deb/*.deb
          - os: windows-latest
            artifact: windows-msi
            glob: composeApp/build/compose/binaries/main/msi/*.msi
          # Dois .dmg: o runner macos-latest é Apple Silicon (arm64), e o JDK
          # embutido no instalador só roda na arquitetura em que foi gerado.
          # Mac com Intel precisa do seu. O macos-13 foi aposentado pelo GitHub (o job
          # ficava na fila sem runner); macos-15-intel é o runner Intel que sobrou.
          - os: macos-latest
            artifact: macos-dmg
            glob: composeApp/build/compose/binaries/main/dmg/*.dmg
            dmg_suffix: apple-silicon
          - os: macos-15-intel
            artifact: macos-intel-dmg
            glob: composeApp/build/compose/binaries/main/dmg/*.dmg
            dmg_suffix: intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # jpackage precisa do WiX Toolset pra gerar .msi no Windows.
      - name: Instalar WiX Toolset
        if: runner.os == 'Windows'
        run: choco install wixtoolset -y

      - name: Gerar instalador do SO atual
        shell: bash
        run: ./gradlew :composeApp:packageDistributionForCurrentOS

      # Os dois .dmg saem com o mesmo nome; o sufixo diz pra qual Mac é cada um.
      - name: Nomear o .dmg pela arquitetura
        if: matrix.dmg_suffix != ''
        shell: bash
        run: |
          for f in composeApp/build/compose/binaries/main/dmg/*.dmg; do
            mv "$f" "${f%.dmg}-${{ matrix.dmg_suffix }}.dmg"
          done

      # O jpackage grava o erro real num arquivo à parte (não sai no stdout do
      # Gradle acima) — sem isso, uma falha só mostra "exit code 1" sem dizer o motivo.
      - name: Mostrar logs do jpackage em caso de falha
        if: failure()
        shell: bash
        run: |
          find composeApp/build/compose/logs -type f 2>/dev/null | while read -r f; do
            echo "== $f =="
            cat "$f"
          done

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.glob }}

  draft-release:
    needs: build-installer
    # Segue mesmo se algum SO falhar, pra ainda ter um rascunho com os
    # instaladores que deram certo — revise no GitHub antes de publicar.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Montar notas de release (intro + mudanças do CHANGELOG.md + doação + instalação)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="[$VERSION]" '
            /^## \[/ {
              if (printing) exit
              if (index($0, ver) > 0) { printing = 1; next }
            }
            printing { print }
          ' CHANGELOG.md > changelog_section.md

          cat > release_notes.md <<'EOF'
          3DReport é um app gratuito e de código aberto para orçamentos de
          impressão 3D — do custo de produção ao preço de venda, com controle
          de filamentos/impressoras e histórico de vendas.

          ## O que mudou
          EOF

          cat changelog_section.md >> release_notes.md

          cat >> release_notes.md <<'EOF'

          ## Apoie o projeto

          O 3DReport é e sempre será gratuito — mantido só com doações
          voluntárias. Se ele te ajuda, considere apoiar:
          [Buy Me a Coffee](https://buymeacoffee.com/mateustoin).

          ## Instalação

          Baixe o instalador do seu sistema abaixo, em **Assets**. Como não
          são assinados digitalmente (custo recorrente incompatível com o
          modelo gratuito), alguns sistemas avisam antes de abrir:

          - **Windows (`.msi`)** — o SmartScreen pode avisar "Editor
            desconhecido": clique em "Mais informações" → "Executar assim
            mesmo".
          - **macOS (`.dmg`)** — baixe o `-apple-silicon` pra Mac com chip M1
            ou mais novo, e o `-intel` pra Mac com processador Intel. O macOS
            pode bloquear a abertura. Tente clicar com
            o botão direito no app → "Abrir"; se essa opção não resolver
            (comum em versões mais recentes do macOS), vá em **Ajustes do
            Sistema → Privacidade e Segurança**, role até o aviso de que o
            app foi bloqueado e clique em **"Abrir mesmo assim"** (pode
            pedir confirmação com senha/Touch ID).
          - **Linux (`.deb`)** — Debian/Ubuntu e derivados:
            `sudo dpkg -i threedreport_*.deb`.
          EOF

          cat release_notes.md

      - name: Criar release em rascunho
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 3DReport ${{ github.ref_name }}
          body_path: release_notes.md
          draft: true
          files: dist/**/*
