name: Release

# Dispara só com o push de uma tag de versão (ex.: v0.3.0) — nunca em push
# normal de branch. Ver docs/development.md#como-cortar-um-release.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-installer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-deb
            glob: composeApp/build/compose/binaries/main/deb/*.deb
          - os: windows-latest
            artifact: windows-msi
            glob: composeApp/build/compose/binaries/main/msi/*.msi
          - os: macos-latest
            artifact: macos-dmg
            glob: composeApp/build/compose/binaries/main/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # jpackage precisa do WiX Toolset pra gerar .msi no Windows.
      - name: Instalar WiX Toolset
        if: runner.os == 'Windows'
        run: choco install wixtoolset -y

      - name: Gerar instalador do SO atual
        shell: bash
        run: ./gradlew :composeApp:packageDistributionForCurrentOS

      # O jpackage grava o erro real num arquivo à parte (não sai no stdout do
      # Gradle acima) — sem isso, uma falha só mostra "exit code 1" sem dizer o motivo.
      - name: Mostrar logs do jpackage em caso de falha
        if: failure()
        shell: bash
        run: |
          find composeApp/build/compose/logs -type f 2>/dev/null | while read -r f; do
            echo "== $f =="
            cat "$f"
          done

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.glob }}

  draft-release:
    needs: build-installer
    # Segue mesmo se algum SO falhar, pra ainda ter um rascunho com os
    # instaladores que deram certo — revise no GitHub antes de publicar.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Extrair a seção da versão do CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="[$VERSION]" '
            /^## \[/ {
              if (printing) exit
              if (index($0, ver) > 0) { printing = 1; next }
            }
            printing { print }
          ' CHANGELOG.md > release_notes.md
          cat release_notes.md

      - name: Criar release em rascunho
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 3DReport ${{ github.ref_name }}
          body_path: release_notes.md
          draft: true
          files: dist/**/*
